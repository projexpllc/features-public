name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem or gap this feature would address.
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: Primary Target Persona
      description: Who would primarily benefit from this feature?
      options:
        - End-User
        - Admin
        - Developer
    validations:
      required: true
